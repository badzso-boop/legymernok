name: Mission Verification Workflow

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          fi

      - name: Run Engineering Check
        uses: http://gitea:3000/legymernok_admin/mission-verifier/actions@main
        with:
          verification_secret: ${{ secrets.MISSION_VERIFICATION_SECRET }}
          mission_id: ${{ github.event.repository.name }}
          backend_url: "http://backend:8080"
