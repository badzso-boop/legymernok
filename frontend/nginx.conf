server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Docker beépített DNS-e — a $backend_upstream változóba tett proxy_pass miatt kell:
    # ezzel nginx minden kéréskor (valid=10s cache mellett) újrafeloldja a "backend" nevet,
    # ahelyett hogy egyszer, worker-indításkor lecache-elné az akkori IP-t. Enélkül egy
    # backend-konténer restart/recreate (ami új IP-t kap) 502-t okoz itt, amíg a frontend
    # konténert is manuálisan újra nem indítjuk (ld. a repo gyökér CLAUDE.md gotcha-ját).
    resolver 127.0.0.11 valid=10s;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # STOMP/SockJS végpontok (WebSocket upgrade + polling fallback)
    location /ws-mission-logs/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream/ws-mission-logs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws-log/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream/ws-log/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
