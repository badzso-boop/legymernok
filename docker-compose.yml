version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Database Service (PostgreSQL)
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legymernok-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      # .env-ből jön, mint a többi secret — lásd .env.example. NEM biztonságos
      # nyers értéket hagyni itt: lásd plans/security_audit_2026-07-30.md #3.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Inicializáló scriptek (létrehozza a 'legymernok' és 'gitea' DB-ket)
      - ./postgres-init:/docker-entrypoint-initdb.d
      # Perzisztens adattárolás
      - postgres_data:/var/lib/postgresql/data
    networks:
      - legymernok-net

  # ---------------------------------------------------------------------------
  # Gitea Service (Saját Git Szerver)
  # ---------------------------------------------------------------------------
  gitea:
    image: gitea/gitea:1.25.0
    container_name: legymernok-gitea
    restart: always
    environment:
      - USER_UID=1000
      - USER_GID=1000

      # DATABASE
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=postgres
      - GITEA__database__PASSWD=${POSTGRES_PASSWORD}
      - GITEA__actions__ENABLED=true
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__security__SECRET_KEY=${GITEA_SECRET_KEY}
      - GITEA__security__INTERNAL_TOKEN=${GITEA_INTERNAL_TOKEN}
      - GITEA__oauth2__JWT_SECRET=${GITEA_JWT_SECRET}
      # Enélkül Gitea a belső HTTP_PORT-ot (3000) írja bele a generált
      # clone URL-ekbe, holott a host felé ez 3001-en van kiadva.
      - GITEA__server__ROOT_URL=http://localhost:3001/
    ports:
      - "3001:3000" # Web UI: http://localhost:3001
      - "2222:22" # SSH port
    volumes:
      - gitea_data:/data
    depends_on:
      - postgres
    networks:
      - legymernok-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # Backend Service (Spring Boot)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legymernok-backend
    restart: always
    environment:
      # Kapcsolódás a fenti 'postgres' service-hez
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/legymernok
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Automatikus séma frissítés (fejlesztéshez)
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Secrets - .env fájlból töltődnek be
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD}
      GITEA_ADMIN_TOKEN: ${GITEA_ADMIN_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      MISSION_VERIFICATION_SECRET: ${MISSION_VERIFICATION_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO_OWNER: ${GITHUB_REPO_OWNER:-badzso-boop}
      GITHUB_REPO_NAME: ${GITHUB_REPO_NAME:-legymernok}
    ports:
      - "8090:8080"
    depends_on:
      - postgres
    networks:
      - legymernok-net
      # A kadét-vezérelt CI job-konténerek (lásd runner-config.yaml network:)
      # csak ezen a hálózaton érik el a backendet — a mission-verification
      # callback-hoz kell, de innen SEM a postgres-t, SEM a gitea-t nem érik el.
      - legymernok-runner-net

  # ---------------------------------------------------------------------------
  # Frontend Service (React + Vite + Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legymernok-frontend
    restart: always
    ports:
      - "3000:80" # Web UI: http://localhost:3000
    depends_on:
      - backend
    networks:
      - legymernok-net

  # ---------------------------------------------------------------------------
  # Ollama — lokális LLM szerver
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama
    container_name: legymernok-ollama
    restart: always
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_REQUEST_TIMEOUT: "600"
    volumes:
      - /mnt/g/Projects/AI Models:/gguf:ro
      - ollama_data:/root/.ollama
    networks:
      - legymernok-net

  # ---------------------------------------------------------------------------
  # AI Service — embedding + generálás FastAPI wrapper
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: legymernok-ai-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      CHAT_MODEL: ${CHAT_MODEL:-gemma3:8b-q4_K_M}
    depends_on:
      - ollama
    networks:
      - legymernok-net

  # ---------------------------------------------------------------------------
  # Gitea Actions Runner Service
  # ---------------------------------------------------------------------------

  runner:
    image: docker.io/gitea/act_runner:0.6.1
    container_name: legymernok-gitea-runner
    environment:
      CONFIG_FILE: "/config.yaml"
      GITEA_INSTANCE_URL: "http://gitea:3000"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${REGISTRATION_TOKEN}"
      GITEA_RUNNER_NAME: "Gitea Runner"
    depends_on:
      gitea:
        condition: service_healthy
    networks:
      # A runner daemon-nak (ez a konténer) kell a gitea-t elérnie, hogy
      # regisztráljon/job-ot pollozzon — ez marad a fő hálózaton. Az általa
      # docker.sock-on keresztül indított, kadét-kódot futtató JOB-konténerek
      # NEM ide, hanem a runner-config.yaml `network:` mezője által megadott,
      # elkülönített `legymernok-runner-net`-re kerülnek — lásd ott a
      # indoklást (plans/security_audit_2026-07-30.md #2).
      - legymernok-net
    volumes:
      - ./runner-config.yaml:/config.yaml
      - ./runner:/data
      - /var/run/docker.sock:/var/run/docker.sock

# -----------------------------------------------------------------------------
# Volumes and Networks
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
  gitea_data:
  gitea_runner_data:
  ollama_data:

networks:
  legymernok-net:
    external: true
    driver: bridge
  # Elkülönített hálózat a Gitea Actions job-konténereknek (kadét write-joggal
  # módosítható .gitea/workflows/ci.yml futtatja bennük a kódot) — csak a
  # backendet érik el innen (mission-verification callback), a postgres-t,
  # gitea-t és a többi belső service-t nem. Lásd runner-config.yaml `network:`.
  legymernok-runner-net:
    driver: bridge
