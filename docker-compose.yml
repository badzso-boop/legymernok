version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Database Service (PostgreSQL)
  # ---------------------------------------------------------------------------
  # profiles: ["standalone"] — csak akkor indul, ha `docker compose --profile
  # standalone up` fut. Ez teszi lehetővé, hogy a homelab szerveren egy közös,
  # több projektet kiszolgáló Postgres instance-ra álljunk át (lásd
  # SPRING_DATASOURCE_URL / GITEA__database__* env-var indirekció lentebb),
  # miközben egy friss klónnál `docker compose --profile standalone up`
  # továbbra is teljesen önmagában felhúzza ezt a saját, lokális DB-t.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legymernok-postgres
    restart: always
    profiles: ["standalone"]
    environment:
      POSTGRES_USER: postgres
      # .env-ből jön, mint a többi secret — lásd .env.example. NEM biztonságos
      # nyers értéket hagyni itt: lásd plans/security_audit_2026-07-30.md #3.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Inicializáló scriptek (létrehozza a 'legymernok' és 'gitea' DB-ket)
      - ./postgres-init:/docker-entrypoint-initdb.d
      # Perzisztens adattárolás
      - postgres_data:/var/lib/postgresql/data
    networks:
      - legymernok-net

  # ---------------------------------------------------------------------------
  # Gitea Service (Saját Git Szerver)
  # ---------------------------------------------------------------------------
  gitea:
    image: gitea/gitea:1.25.0
    container_name: legymernok-gitea
    restart: always
    environment:
      - USER_UID=1000
      - USER_GID=1000

      # DATABASE — a defaultok a lokális `postgres` service-re mutatnak (lásd a
      # `profiles: ["standalone"]` megjegyzést fent); a homelab szerveren ezeket
      # a .env (git-ignorolt, csak ott) a közös instance-ra írja felül.
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=${GITEA_DATABASE_HOST:-postgres:5432}
      - GITEA__database__NAME=${GITEA_DATABASE_NAME:-gitea}
      - GITEA__database__USER=${GITEA_DATABASE_USER:-postgres}
      - GITEA__database__PASSWD=${GITEA_DATABASE_PASSWORD:-${POSTGRES_PASSWORD}}
      - GITEA__actions__ENABLED=true
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__security__SECRET_KEY=${GITEA_SECRET_KEY}
      - GITEA__security__INTERNAL_TOKEN=${GITEA_INTERNAL_TOKEN}
      - GITEA__oauth2__JWT_SECRET=${GITEA_JWT_SECRET}
      # Enélkül Gitea a belső HTTP_PORT-ot (3000) írja bele a generált
      # clone URL-ekbe, holott a host felé ez 3001-en van kiadva.
      - GITEA__server__ROOT_URL=http://localhost:3001/
    ports:
      - "3001:3000" # Web UI: http://localhost:3001
      - "2222:22" # SSH port
    volumes:
      - gitea_data:/data
    # Nincs explicit depends_on a `postgres` service-re: az profil mögé került
    # (lásd fent), így a shared-Postgres módban (homelab szerver, nincs profil
    # aktiválva) nem is létezne a service, amire mutatna — Compose ilyenkor
    # hibával elszállna egy definiálatlan service-re mutató depends_on miatt.
    # A `postgres` service-nek amúgy sem volt healthcheck-je, tehát a korábbi
    # depends_on is csak "induljon el a konténer" szintű garanciát adott, nem
    # DB-readiness-t — Gitea saját maga retry-el kapcsolódáskor.
    networks:
      - legymernok-net
      # A kadét-vezérelt CI job-konténerek (legymernok-runner-net) itt futtatják
      # az `actions/checkout@...`-ot, ami a SAJÁT job-konténerén belülről,
      # közvetlen git-fetch-csel klónozza a mission repót a Gitea-ból — ehhez
      # elengedhetetlen, hogy a job-konténer fel tudja oldani/elérje a "gitea"
      # hostnevet. (A postgres NINCS ezen a hálózaton, úgyhogy a job-konténerek
      # onnan továbbra sem érik el — lásd runner-config.yaml és a
      # legymernok-runner-net hálózat leírását.)
      - legymernok-runner-net
      # Csak akkor releváns, ha a homelab szerver közös Postgres instance-ára
      # kötünk (lásd GITEA__database__HOST override) — standalone módban
      # csatlakozva marad, de nem használjuk.
      - shared-db-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # Backend Service (Spring Boot)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legymernok-backend
    restart: always
    environment:
      # Kapcsolódás a fenti 'postgres' service-hez alapból; a homelab szerveren
      # a .env (git-ignorolt) ezeket a közös Postgres instance-ra írja felül —
      # lásd a `postgres` service `profiles: ["standalone"]` megjegyzését fent.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/legymernok}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${POSTGRES_PASSWORD}}
      # SPRING_JPA_HIBERNATE_DDL_AUTO SZÁNDÉKOSAN NINCS ITT: env-var-ként
      # felülírta volna az application.properties-ben beállított
      # `spring.jpa.hibernate.ddl-auto=validate` értéket (Spring Boot
      # precedencia: env var > properties fájl) — a projekt ténylegesen
      # Flyway-migrációkkal kezeli a sémát (db/migration/V1-V6), a Hibernate
      # csak validál induláskor. Ha valaha ide kerülne, az csendben `update`-re
      # váltaná a validate-et, elrejtve pont azt a séma-drift hibaosztályt
      # (entitás vs. élő Postgres-constraint eltérés), ami ennél a projektnél
      # már 3x okozott hibát (lásd CLAUDE.md "Biztonsági alapelvek").
      # Secrets - .env fájlból töltődnek be
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD}
      GITEA_ADMIN_TOKEN: ${GITEA_ADMIN_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      MISSION_VERIFICATION_SECRET: ${MISSION_VERIFICATION_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_REPO_OWNER: ${GITHUB_REPO_OWNER:-badzso-boop}
      GITHUB_REPO_NAME: ${GITHUB_REPO_NAME:-legymernok}
    ports:
      - "8090:8080"
    # Nincs explicit depends_on a `postgres` service-re — lásd a `gitea`
    # service-nél lévő megjegyzést ugyanerről (profil mögé került, Spring
    # Boot saját maga retry-el kapcsolódáskor).
    networks:
      - legymernok-net
      # A kadét-vezérelt CI job-konténerek (lásd runner-config.yaml network:)
      # ezen a hálózaton érik el a backendet — a mission-verification
      # callback-hoz kell. A gitea szolgáltatás is csatlakozik ehhez a
      # hálózathoz (az `actions/checkout` lépéshez szükséges), de a postgres
      # SOSEM — az csak a legymernok-net-en van, a job-konténerek onnan nem
      # érik el.
      - legymernok-runner-net
      # Csak akkor releváns, ha a homelab szerver közös Postgres instance-ára
      # kötünk (lásd SPRING_DATASOURCE_URL override) — standalone módban
      # csatlakozva marad, de nem használjuk.
      - shared-db-net

  # ---------------------------------------------------------------------------
  # Frontend Service (React + Vite + Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legymernok-frontend
    restart: always
    ports:
      - "3000:80" # Web UI: http://localhost:3000
    depends_on:
      - backend
    networks:
      - legymernok-net

  # ---------------------------------------------------------------------------
  # Ollama — lokális LLM szerver
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama
    container_name: legymernok-ollama
    restart: always
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_REQUEST_TIMEOUT: "600"
    volumes:
      - /mnt/g/Projects/AI Models:/gguf:ro
      - ollama_data:/root/.ollama
    networks:
      - legymernok-net

  # ---------------------------------------------------------------------------
  # AI Service — embedding + generálás FastAPI wrapper
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: legymernok-ai-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      CHAT_MODEL: ${CHAT_MODEL:-gemma3:8b-q4_K_M}
    depends_on:
      - ollama
    networks:
      - legymernok-net

  # ---------------------------------------------------------------------------
  # Gitea Actions Runner Service
  # ---------------------------------------------------------------------------

  runner:
    image: docker.io/gitea/act_runner:0.6.1
    container_name: legymernok-gitea-runner
    restart: unless-stopped
    environment:
      CONFIG_FILE: "/config.yaml"
      GITEA_INSTANCE_URL: "http://gitea:3000"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${REGISTRATION_TOKEN}"
      GITEA_RUNNER_NAME: "Gitea Runner"
    depends_on:
      gitea:
        condition: service_healthy
    networks:
      # A runner daemon-nak (ez a konténer) kell a gitea-t elérnie, hogy
      # regisztráljon/job-ot pollozzon — ez marad a fő hálózaton. Az általa
      # docker.sock-on keresztül indított, kadét-kódot futtató JOB-konténerek
      # NEM ide, hanem a runner-config.yaml `network:` mezője által megadott,
      # elkülönített `legymernok-runner-net`-re kerülnek — lásd ott a
      # indoklást (plans/security_audit_2026-07-30.md #2).
      - legymernok-net
    volumes:
      - ./runner-config.yaml:/config.yaml
      - ./runner:/data
      - /var/run/docker.sock:/var/run/docker.sock

# -----------------------------------------------------------------------------
# Volumes and Networks
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
  gitea_data:
  gitea_runner_data:
  ollama_data:

networks:
  legymernok-net:
    external: true
    driver: bridge
  # Elkülönített hálózat a Gitea Actions job-konténereknek (kadét write-joggal
  # módosítható .gitea/workflows/ci.yml futtatja bennük a kódot) — a backendet
  # (mission-verification callback) és a gitea-t (actions/checkout) érik el
  # innen, de a postgres-t és a többi belső service-t nem. Lásd
  # runner-config.yaml `network:`.
  # external: true — enélkül a Compose a projekt-prefixet ("legymernok_")
  # is a hálózat nevéhez fűzi, de a runner-config.yaml `container.network`
  # mezője a puszta "legymernok-runner-net" nevet várja el (act_runner ezt
  # magának a job-konténereknek adja át a Docker API-n keresztül, nem a
  # Compose-on át) — a névütközés miatt minden CI job "network ... not
  # found" hibával elszállt. Így, ahogy a legymernok-net is, előre létre
  # kell hozni: `docker network create legymernok-runner-net`.
  legymernok-runner-net:
    external: true
  # A homelab szerver közös, több projektet kiszolgáló Postgres instance-ának
  # hálózata — csak akkor releváns, ha a GITEA__database__HOST/
  # SPRING_DATASOURCE_URL a .env-ben a közösre van átírva. Egy friss klónnál,
  # standalone módban létezik, de nincs mit elérnie rajta. Előfeltétel:
  # `docker network create shared-db-net`.
  shared-db-net:
    external: true
