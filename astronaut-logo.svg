<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LégyMérnök.hu kadét sisak logó">
  <!-- Sisak kontúr -->
  <circle cx="32" cy="30" r="22" fill="#e2e8f0" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Oldalsó modulok (fül-egységek) -->
  <circle cx="10" cy="30" r="5" fill="#cbd5e1" stroke="#1e293b" stroke-width="2"/>
  <circle cx="54" cy="30" r="5" fill="#cbd5e1" stroke="#1e293b" stroke-width="2"/>
  <circle cx="10" cy="30" r="2" fill="#33ff00"/>
  <circle cx="54" cy="30" r="2" fill="#33ff00"/>

  <!-- Nyakgyűrű -->
  <path d="M18 46 L18 52 Q32 58 46 52 L46 46 Z" fill="#94a3b8" stroke="#1e293b" stroke-width="2"/>

  <!-- Antenna -->
  <line x1="32" y1="8" x2="32" y2="2" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="2" r="2.3" fill="#33ff00">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Vizor -->
  <ellipse cx="32" cy="31" rx="15" ry="13" fill="#050b18" stroke="#1e293b" stroke-width="2"/>

  <!-- Vizor tükröződés (csillagok + fényív) -->
  <path d="M20 24 A 15 13 0 0 1 34 19" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.55"/>
  <circle cx="26" cy="26" r="1.1" fill="#ffffff"/>
  <circle cx="31" cy="22" r="0.8" fill="#ffffff"/>
  <circle cx="38" cy="36" r="1.3" fill="#33ff00" opacity="0.9"/>

  <!-- Sisak fény-csík -->
  <path d="M12 22 A 22 22 0 0 1 30 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.35"/>
</svg>
